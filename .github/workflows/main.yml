name: MLflow - ePesantren

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CSV_URL: "data_tagihan_bersih.csv"
  TARGET_VAR: "status_pembayaran"

jobs:
  run-mlflow-and-build-docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python 3.12.7
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      # 3. Cek Environment Variables
      - name: Check Env
        run: |
          echo "Membaca dataset dari: $CSV_URL"
          echo "Target prediksi: $TARGET_VAR"

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow
          pip install -r MLProject/requirements.txt

      # 5. Jalankan MLflow project
      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager=local

      # 6. Dapatkan RUN ID
      - name: Get latest MLflow run_id
        run: |
          python - <<EOF
          import mlflow

          runs = mlflow.search_runs(experiment_ids=["0"])
          run_id = runs.iloc[0]["run_id"]

          print("Latest run:", run_id)

          with open("${GITHUB_ENV}", "a") as f:
              f.write(f"RUN_ID={run_id}\n")
          EOF

      # 7. Build Docker Image (Ganti nama image lokal menjadi epesantren-model)
      - name: Build Docker Model
        run: |
          mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "epesantren-model"

      # 8. Login ke Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 9. Tag Docker Image agar sesuai dengan akun Docker Hub Anda (myninetale/epesantren-model)
      - name: Tag Docker Image
        run: |
          docker tag epesantren-model ${{ secrets.DOCKER_HUB_USERNAME }}/epesantren-model:latest

      # 10. Push Docker Image ke Docker Hub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/epesantren-model:latest
